<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (corners get cropped into a circle by FB) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="90" r="130" fill="white" fill-opacity="0.04"/>
  <circle cx="90" cy="440" r="110" fill="white" fill-opacity="0.04"/>

  <!-- Tag icon, centered above the text -->
  <g transform="translate(212, 92)">
    <path d="M8 40 L48 0 L80 0 L80 32 L40 72 Z" fill="url(#accent)"/>
    <circle cx="62" cy="18" r="7" fill="white"/>
  </g>

  <!-- KC -->
  <text x="256" y="330" font-family="Arial Black, Arial, sans-serif" font-size="150" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">KC</text>

  <!-- GARAGE SALES -->
  <text x="256" y="392" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="2">GARAGE SALES</text>
</svg>
